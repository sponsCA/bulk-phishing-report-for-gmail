name: Release

# Pushing a tag such as v0.1.0 publishes a GitHub Release with the extension packaged as a .zip.
on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "ZIP=bulk-phishing-report-for-gmail-$version.zip" >> "$GITHUB_ENV"
      - name: Package the extension
        run: zip -r "$ZIP" manifest.json LICENSE src _locales popup icons/*.png
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
